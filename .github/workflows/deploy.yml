name: Build and Deploy Backend (ACR)

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ 拉代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ 登录阿里云 ACR
      - name: Login ACR (Aliyun)
        uses: docker/login-action@v3
        with:
          registry: crpi-3iew34pvm0fklze5.cn-chengdu.personal.cr.aliyuncs.com
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 3️⃣ 构建并推送镜像（latest + sha）
      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            crpi-3iew34pvm0fklze5.cn-chengdu.personal.cr.aliyuncs.com/jijiking1/ai-backend:latest
            crpi-3iew34pvm0fklze5.cn-chengdu.personal.cr.aliyuncs.com/jijiking1/ai-backend:${{ github.sha }}

      # 4️⃣ 部署到服务器（核心）
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ~/jjtools

            echo "==== 更新 backend 镜像版本 ===="
            sed -i "s|crpi-3iew34pvm0fklze5.cn-chengdu.personal.cr.aliyuncs.com/jijiking1/ai-backend:.*|crpi-3iew34pvm0fklze5.cn-chengdu.personal.cr.aliyuncs.com/jijiking1/ai-backend:${{ github.sha }}|g" docker-compose.yml

            echo "==== 登录 ACR ===="
            docker login --username=${{ secrets.ACR_USERNAME }} crpi-3iew34pvm0fklze5.cn-chengdu.personal.cr.aliyuncs.com -p ${{ secrets.ACR_PASSWORD }}

            echo "==== 拉取新镜像（ACR）===="
            docker compose pull backend || echo "pull failed, fallback local"

            echo "==== 重启 backend ===="
            docker compose up -d backend

            echo "==== 当前版本 ===="
            docker ps | grep ai-backend
